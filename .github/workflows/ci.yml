name: Verificar Latente
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: latente
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: latente_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U latente -d latente_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://latente:test_only@localhost:5432/latente_test
      TEST_DATABASE_URL: postgresql+psycopg://latente:test_only@localhost:5432/latente_test
      DATA_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: alembic upgrade head && python -m pytest -q && alembic check
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: latente-cloudflare
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet && docker compose up -d --build
      - run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors --retry-connrefused http://localhost:8080/api/health
      - run: bash scripts/smoke.sh
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
  railway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/railway/compose.test.yml up -d --build
      - run: |
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors --retry-connrefused http://localhost:8088/api/health
          curl --fail http://localhost:8088/ | grep -q '/assets/'
          curl --fail http://localhost:8088/api/leagues | python -c 'import json,sys; r=json.load(sys.stdin); assert r["meta"]["mode"] == "demo" and len(r["data"]) == 12'
          docker compose -f deploy/railway/compose.test.yml wait ingest
          curl --fail http://localhost:8088/api/status | python -c 'import json,sys; assert json.load(sys.stdin)["data"]["worker_online"]'
          curl --fail -s -D - -o /dev/null -H 'Origin: https://latente.dimebag.workers.dev' http://localhost:8088/api/leagues | grep -qi 'access-control-allow-origin: https://latente.dimebag.workers.dev'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/.env)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/api/docs)" = "404"
          curl -fsSI http://localhost:8088/ | grep -qi 'strict-transport-security:'
          curl -fsS http://localhost:8088/robots.txt | grep -q 'Sitemap: https://latente.cfd/sitemap.xml'
      - if: always()
        run: docker compose -f deploy/railway/compose.test.yml logs --no-color
      - if: always()
        run: docker compose -f deploy/railway/compose.test.yml down -v
