name: Verificar Latente
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: latente
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: latente_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U latente -d latente_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://latente:test_only@localhost:5432/latente_test
      TEST_DATABASE_URL: postgresql+psycopg://latente:test_only@localhost:5432/latente_test
      DATA_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: alembic upgrade head && python -m pytest -q && alembic check
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run build
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet && docker compose up -d --build
      - run: curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8080/api/health
      - run: bash scripts/smoke.sh
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
