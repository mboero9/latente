user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 1k;
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types application/json application/javascript text/css image/svg+xml;
  # Swagger de FastAPI utiliza su CDN e inicialización inline únicamente en /api/docs.
  map $uri $latente_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://media.api-sports.io https://upload.wikimedia.org https://cdn.nba.com; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'";
    /api/docs "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
  }
  log_format compact '$remote_addr $request_method $uri $status $body_bytes_sent';
  access_log /dev/stdout compact;
  error_log /dev/stderr warn;
  # En Tunnel el origin solo se expone en loopback/red Docker.
  # No confiar en cabeceras de IP suministradas por Internet para controles de acceso.
  server {
    listen 8080;
    server_name latente.com.ar www.latente.com.ar api.latente.com.ar localhost;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Content-Security-Policy $latente_csp always;
    location /api/ {
      limit_except GET OPTIONS { deny all; }
      # DNS dinámico de Docker: tolera cambio de IP tras recrear el contenedor API.
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $api http://api:8000;
      proxy_pass $api$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_hide_header Server;
    }
    location /assets/ {
      expires 1y;
      try_files $uri =404;
    }
    location = /index.html {
      expires -1;
    }
    location / {
      try_files $uri $uri/ /index.html;
    }
    location ~ /\. { deny all; }
  }
}
