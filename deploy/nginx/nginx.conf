user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 1k;
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types application/json application/javascript text/css image/svg+xml;
  # Railway añade X-Real-IP con la IP del visitante (si falta, usar IP
  # de conexión). No confiar en X-Forwarded-For aportado por clientes.
  map $http_x_real_ip $latente_client_key {
    default $binary_remote_addr;
    ~^[0-9a-fA-F:.]+$ $http_x_real_ip;
  }
  limit_req_zone $latente_client_key zone=latente_api_ratelimit:10m rate=8r/s;
  limit_conn_zone $latente_client_key zone=latente_api_connections:10m;
  limit_req_status 429;
  limit_conn_status 429;
  # Breve cache solo para GET públicos; reduce scraping repetido y carga DB.
  proxy_cache_path /var/cache/nginx/latente levels=1:2 keys_zone=latente_api_cache:12m
    max_size=64m inactive=15m use_temp_path=off;
  # Swagger de FastAPI utiliza su CDN e inicialización inline únicamente en /api/docs.
  map $uri $latente_csp {
    default "default-src 'self'; script-src 'self' 'sha256-ysGeeQOGvlAVMwR6PMF4sfjfGXkjR7XzKIrmHMEn5ms=' https://www.googletagmanager.com https://pagead2.googlesyndication.com; style-src 'self'; img-src 'self' data: https://api.urba.org.ar https://flagcdn.com https://media.api-sports.io https://upload.wikimedia.org https://cdn.nba.com https://www.thesportsdb.com https://r2.thesportsdb.com https://thesportsdb.com https://a.espncdn.com https://a1.espncdn.com https://a2.espncdn.com https://cdn.espn.com https://www.google.com https://www.google.com.ar https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google-analytics.com https://region1.google-analytics.com; connect-src 'self' https:; frame-src https://www.googletagmanager.com https://www.google.com https://www.google.com.ar https://td.doubleclick.net; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'";
    /api/docs "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
  }
  log_format compact '$latente_client_key $request_method $uri $status bytes=$body_bytes_sent duration=$request_time';
  access_log /dev/stdout compact;
  error_log /dev/stderr warn;
  # En Tunnel el origin solo se expone en loopback/red Docker.
  # No confiar en cabeceras de IP suministradas por Internet para controles de acceso.
  server {
    listen 8080;
    server_name latente.com.ar www.latente.com.ar api.latente.com.ar localhost;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Content-Security-Policy $latente_csp always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    # Pruebas de vulnerabilidades comunes: nunca tratar estos paths como SPA.
    location ~* ^/(\\.env|\\.git|wp-admin|wp-login\\.php|xmlrpc\\.php|phpmyadmin|cgi-bin|vendor/phpunit|server-status|actuator)(/|$) {
      return 404;
    }
    # Google AdSense crawls /ads.txt at the domain root. Never return the
    # SPA index.html as a fake HTTP 200 for a missing ads.txt file.
    # Inherit server-level security headers; serve genuine plain text only.
    location = /ads.txt {
      default_type text/plain;
      try_files /ads.txt =404;
    }
    location = /api/docs { return 404; }
    location = /api/openapi.json { return 404; }

    location /api/ {
      limit_except GET OPTIONS { deny all; }
      # Capa de contención: ocho requests/segundo por IP identificada en
      # Railway, con margen amplio para el refresco de marcadores.
      limit_req zone=latente_api_ratelimit burst=80 nodelay;
      limit_conn latente_api_connections 18;
      proxy_cache latente_api_cache;
      proxy_cache_methods GET;
      proxy_cache_valid 200 5s;
      proxy_cache_lock on;
      proxy_cache_key "$scheme:$request_method:$host:$request_uri:$http_origin";
      proxy_cache_use_stale updating error timeout http_502 http_503 http_504;
      proxy_cache_bypass $http_authorization;
      proxy_no_cache $http_authorization;
      # DNS dinámico de Docker: tolera cambio de IP tras recrear el contenedor API.
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $api http://api:8000;
      proxy_pass $api$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_hide_header Server;
    }
    location /assets/ {
      expires 1y;
      try_files $uri =404;
    }
    location = /index.html {
      expires -1;
    }
    location / {
      try_files $uri $uri/ /index.html;
    }
    location ~ /\. { deny all; }
  }
}
