# Ejecutar desde la raíz: docker compose -f docker-compose.yml -f deploy/compose.tunnel.yml up -d --build
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Configurá el token del túnel en .env}
    networks: [backend]
    depends_on:
      nginx: { condition: service_healthy }
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
